name: Auto Lotto Update

on:
  schedule:
    # 토요일 21:00 KST (UTC 12:00)
    - cron: '0 12 * * 6'
    # 토요일 21:30 KST (UTC 12:30)
    - cron: '30 12 * * 6'
    # 토요일 22:00 KST (UTC 13:00)
    - cron: '0 13 * * 6'
    # 토요일 23:59 KST (UTC 14:59)
    - cron: '59 14 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 최신 당첨 번호 스크래핑 및 JSON 갱신
        run: node scripts/update-lotto.js

      - name: 변경 사항 Git Commit & Push
        run: |
          git config --global user.name 'Aipluslotto-Bot'
          git config --global user.email 'bot@aipluslotto.com'
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update lotto history" && git push)
