name: Auto Lotto Update

on:
  schedule:
    # 매주 토요일 21:00부터 10~15분 간격 자동 실행 (KST = UTC + 9)
    - cron: '5 12 * * 6'    # 21:05 KST
    - cron: '15 12 * * 6'   # 21:15 KST
    - cron: '30 12 * * 6'   # 21:30 KST
    - cron: '45 12 * * 6'   # 21:45 KST
    - cron: '0 13 * * 6'    # 22:00 KST
    - cron: '30 13 * * 6'   # 22:30 KST
    - cron: '0 14 * * 6'    # 23:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 최신 당첨 번호 스크래핑 및 JSON/HTML 갱신
        run: node scripts/update-lotto.js

      - name: Git Commit & Push (Cloudflare Pages 자동 배포)
        run: |
          git config --global user.name 'Aipluslotto-Bot'
          git config --global user.email 'bot@aipluslotto.com'
          git add data/lotto-history.json index.html
          if git diff --staged --quiet; then
            echo "갱신할 새 회차 데이터가 없습니다."
          else
            git commit -m "Auto update lotto history & index.html"
            git push
          fi
